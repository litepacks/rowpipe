name: Yekpare Multi-Platform Release Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build (${{ matrix.target.target_name }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: darwin
            arch: arm64
            runner: macos-14
            target_name: darwin-arm64
            bin_suffix: ''
          - os: darwin
            arch: x64
            runner: macos-13
            target_name: darwin-x64
            bin_suffix: ''
          - os: linux
            arch: x64
            runner: ubuntu-latest
            target_name: linux-x64
            bin_suffix: ''
          - os: win32
            arch: x64
            runner: windows-latest
            target_name: win32-x64
            bin_suffix: '.exe'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Build standalone executable with Yekpare
        run: npx yekpare build --target ${{ matrix.target.target_name }} --strip

      - name: Validate built executable
        shell: bash
        run: |
          ./dist/rowpipe${{ matrix.target.bin_suffix }} --version
          ./dist/rowpipe${{ matrix.target.bin_suffix }} --help

      - name: Package release archive
        shell: bash
        run: |
          mkdir -p release-pkg
          cp ./dist/rowpipe${{ matrix.target.bin_suffix }} release-pkg/
          cd release-pkg
          if [ "${{ matrix.target.os }}" = "win32" ]; then
            7z a ../rowpipe-${{ matrix.target.target_name }}.zip rowpipe${{ matrix.target.bin_suffix }}
          else
            tar -czvf ../rowpipe-${{ matrix.target.target_name }}.tar.gz rowpipe${{ matrix.target.bin_suffix }}
          fi
          cd ..

          # Build Debian (.deb) package on Linux
          if [ "${{ matrix.target.os }}" = "linux" ]; then
            VERSION=$(node -p "require('./package.json').version")
            mkdir -p deb-pkg/DEBIAN deb-pkg/usr/bin
            cp ./dist/rowpipe deb-pkg/usr/bin/rowpipe
            chmod 0755 deb-pkg/usr/bin/rowpipe
            cat << EOF > deb-pkg/DEBIAN/control
Package: rowpipe
Version: ${VERSION}
Section: utils
Priority: optional
Architecture: amd64
Maintainer: Ahmet Şimşek <iamaroott@gmail.com>
Description: Stream-first tabular data toolkit for CSV, TSV, JSON, JSONL, XLSX, Apache Parquet, and Markdown
EOF
            dpkg-deb --build deb-pkg rowpipe_${VERSION}_amd64.deb
          fi

      - name: Upload Platform Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rowpipe-${{ matrix.target.target_name }}
          path: |
            rowpipe-*.*
            rowpipe_*.deb

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA-256 Checksums & Prepare Formula
        shell: bash
        working-directory: release-artifacts
        run: |
          sha256sum rowpipe-* > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

          # Update Formula/rowpipe.rb with calculated checksums
          DARWIN_ARM64_SHA=$(sha256sum rowpipe-darwin-arm64.tar.gz 2>/dev/null | awk '{print $1}' || echo "")
          DARWIN_X64_SHA=$(sha256sum rowpipe-darwin-x64.tar.gz 2>/dev/null | awk '{print $1}' || echo "")
          LINUX_X64_SHA=$(sha256sum rowpipe-linux-x64.tar.gz 2>/dev/null | awk '{print $1}' || echo "")

          sed -i "s/REPLACE_WITH_DARWIN_ARM64_SHA256/${DARWIN_ARM64_SHA}/g" ../Formula/rowpipe.rb
          sed -i "s/REPLACE_WITH_DARWIN_X64_SHA256/${DARWIN_X64_SHA}/g" ../Formula/rowpipe.rb
          sed -i "s/REPLACE_WITH_LINUX_X64_SHA256/${LINUX_X64_SHA}/g" ../Formula/rowpipe.rb
          cp ../Formula/rowpipe.rb ./rowpipe.rb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/rowpipe-*.tar.gz
            release-artifacts/rowpipe-*.zip
            release-artifacts/rowpipe_*.deb
            release-artifacts/rowpipe.rb
            release-artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true

